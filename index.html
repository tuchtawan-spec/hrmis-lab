<style>

box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1426;--surface:#171E35;--navy:#1A2452;--navy2:#26336B;--teal:#34C2A8;--text:#E5E9F3;--muted:#9CA5BA;--line:#2A3352;--link:#86A9F2;--soft:#1E2743;--ok:#5ACB91;--warn:#E3B061;--bad:#F08A7E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1426;--surface:#171E35;--navy:#1A2452;--navy2:#26336B;--teal:#34C2A8;--text:#E5E9F3;--muted:#9CA5BA;--line:#2A3352;--link:#86A9F2;--soft:#1E2743;--ok:#5ACB91;--warn:#E3B061;--bad:#F08A7E;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:15px;line-height:1.55}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 20px;min-height:54px}
.brand{font-weight:600;font-size:17px;color:#fff;text-decoration:none}
.brand small{font-weight:400;color:#C9D0E6;margin-left:8px;font-size:13px}
.sp{flex:1}
.top select,.top button{font:inherit;font-size:13px;background:var(--navy2);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:6px;padding:6px 10px;cursor:pointer}
.top label{font-size:12px;color:#C9D0E6;display:flex;align-items:center;gap:6px}
.shell{display:grid;grid-template-columns:290px minmax(0,1fr)}
#side{background:var(--surface);border-right:1px solid var(--line);padding:12px;position:sticky;top:54px;height:calc(100vh - 54px);overflow-y:auto}
.homelink{display:block;padding:8px 10px;margin-bottom:8px;border-radius:6px;color:var(--text);text-decoration:none;font-weight:500}
.homelink.act{background:var(--soft)}
.mod{margin-bottom:6px}
.modh{display:flex;align-items:center;gap:10px;width:100%;background:var(--navy);color:#fff;border:0;border-radius:6px;padding:9px 10px;text-align:left;font:inherit;font-weight:500;font-size:14px;line-height:1.3;cursor:pointer}
.modh .th{display:block;font-size:12px;font-weight:400;color:#C9D0E6}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600}
.items{padding:4px 0 6px 6px;display:none}
.mod.open .items,.tile .items{display:block}
.it{display:block;padding:5px 10px;color:var(--link);font-size:14px;text-decoration:none;border-left:2px solid transparent;line-height:1.35}
.it span{display:block;color:var(--muted);font-size:12px}
.it:hover{background:var(--soft)}
.it.act{border-left-color:var(--teal);background:var(--soft)}
main{padding:24px 30px 60px;max-width:1180px;width:100%}
.crumb{color:var(--muted);font-size:13px;margin:0 0 4px}
h1{font-size:25px;font-weight:600;margin:0;line-height:1.3}
h2{font-size:17px;font-weight:600;margin:26px 0 10px}
.sub{color:var(--muted);margin:2px 0 0}
.hint{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:0;padding:10px 14px;margin:16px 0 18px;font-size:14px;max-width:78ch}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:500;color:var(--muted);background:var(--soft);padding:8px 12px;white-space:nowrap}
td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:600;background:var(--soft)}
form.add{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin:0 0 16px}
.f{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:4px}
.f.wide{grid-column:1/-1}
input,select,textarea{font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text);max-width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
td select,td input{padding:4px 6px;font-size:13px}
.btn{font:inherit;font-size:14px;padding:7px 14px;border-radius:6px;border:1px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer;white-space:nowrap}
.btn.g{background:transparent;color:var(--text);border-color:var(--line)}
.btn.t{background:var(--teal);border-color:var(--teal)}
.btn.s{padding:3px 10px;font-size:13px}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.stat b{display:block;font-size:26px;font-weight:600;line-height:1.2}
.stat span{color:var(--muted);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tile .modh{border-radius:0;cursor:default;padding:12px}
.tile .items{padding:8px 4px 10px}
.kan{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--soft);border-radius:8px;padding:8px;min-height:140px}
.col h3{font-size:13px;font-weight:500;margin:2px 4px 8px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:13px}
.card b{font-weight:500;font-size:14px;display:block}
.m{color:var(--muted)}
.card .row{display:flex;gap:6px;margin-top:6px;align-items:center}
.tree ul{list-style:none;padding-left:20px;margin:4px 0;border-left:1px dashed var(--line)}
.tree>ul{border-left:0;padding-left:0}
.tree li{margin:6px 0}
.unit{display:inline-block;background:var(--navy);color:#fff;border-radius:6px;padding:4px 10px;font-weight:500;font-size:14px}
.pos{font-size:13px;color:var(--muted);margin:3px 0 0 4px}
.pos b{color:var(--text);font-weight:500}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--teal)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.panel h3{font-size:15px;font-weight:600;margin:0 0 8px}
.ex{list-style:none;padding:0;margin:0}
.ex li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ex li:first-child{border-top:0}
.ck{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:#fff}
.ex li.done .ck{background:var(--teal);border-color:var(--teal)}
.ex li.done .tx{color:var(--muted);text-decoration:line-through}
.ex .tx{flex:1;font-size:14px}
.ex a{font-size:13px;color:var(--link)}
.empty{color:var(--muted);padding:14px;background:var(--surface);border:1px dashed var(--line);border-radius:8px}
.note{font-size:13px;color:var(--muted);max-width:78ch}
.low{background:color-mix(in srgb,var(--bad) 14%,transparent)}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0}
.search{width:100%;max-width:420px;margin-bottom:12px}
.ctx{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--navy);border-radius:0;padding:9px 14px;margin:0 0 18px;font-size:14px}
.ctx b{font-weight:600}.ctx.warn{border-left-color:var(--warn)}

.who{font-size:12px;color:#C9D0E6}
.tag{font-size:12px;background:var(--teal);color:#fff;border-radius:999px;padding:2px 10px;white-space:nowrap}
.hm{width:22px;height:22px;border-radius:4px;background:var(--soft);border:1px solid var(--line);display:inline-grid;place-items:center;font-size:12px;color:#fff}
.hm.on{background:var(--teal);border-color:var(--teal)}
td.c,th.c{text-align:center;padding-left:4px;padding-right:4px}
.legend{columns:2 260px;font-size:13px;color:var(--muted);padding-left:22px;margin:10px 0 0}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin:16px 0}
.teams .panel{display:flex;flex-direction:column;gap:6px}
.inline{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
body.portal{--navy:#0E5E55;--navy2:#137267}
.navh{font-size:12px;color:var(--muted);margin:14px 10px 4px;font-weight:500}
.accts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.acct{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;font:inherit;color:var(--text)}
.acct:hover{border-color:var(--teal)}.acct b{font-weight:600}
.acct[disabled]{opacity:.55;cursor:not-allowed}.acct[disabled]:hover{border-color:var(--line)}
a.stat{color:var(--text);text-decoration:none}a.stat:hover{border-color:var(--teal)}
.lab{border-left:3px solid var(--warn)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;min-width:560px}
.cal .hd{font-size:12px;color:var(--muted);text-align:center;padding:2px}
.cal .d{min-height:78px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;overflow:hidden}
.cal .d b{font-weight:500}.cal .d.we{background:var(--soft)}.cal .d.hol{border-color:var(--teal)}.cal .d.today{outline:2px solid var(--navy);outline-offset:-1px}
.ev{display:block;margin-top:3px;border-radius:4px;padding:1px 5px;font-size:11px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.h{background:color-mix(in srgb,var(--teal) 20%,transparent)}.ev.l{background:color-mix(in srgb,var(--warn) 22%,transparent)}
.denied{max-width:680px}.code403{font-size:56px;font-weight:600;color:var(--bad);line-height:1;margin:0 0 6px}
.slip{max-width:620px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;font-size:14px;z-index:30;max-width:90vw}
#toast.on{opacity:1}
.menu-btn{display:none}
@media(max-width:880px){.shell{grid-template-columns:1fr}#side{display:none;position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}body.nav #side{display:block}.menu-btn{display:inline-block}main{padding:18px 16px 50px}.brand small{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function table(heads,rows,empty,numCols=[]){
  if(!rows.length)return `<p class="empty">${empty||'No records yet. Use the form above to add one.'}</p>`;
  return `<div class="tw"><table><thead><tr>${heads.map((h,i)=>`<th class="${numCols.includes(i)?'n':''}">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="${r.cls||''}">${r.map((c,i)=>`<td class="${numCols.includes(i)?'n':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function optHtml(o,cur){return o.map(x=>{const[v,l]=Array.isArray(x)?x:[x,x];return `<option value="${esc(v)}" ${String(v)===String(cur)?'selected':''}>${esc(l)}</option>`}).join('')}
function fieldHtml(f){
  const o=typeof f.o==='function'?f.o():f.o;const v=typeof f.v==='function'?f.v():(f.v??'');let inner;
  if(o)inner=`<select name="${f.k}" ${f.req?'required':''}><option value="">Choose</option>${optHtml(o,v)}</select>`;
  else if(f.t==='area')inner=`<textarea name="${f.k}" ${f.req?'required':''}>${esc(v)}</textarea>`;
  else inner=`<input name="${f.k}" type="${f.t||'text'}" ${f.req?'required':''} ${f.t==='number'?'step="any" min="0"':''} value="${esc(v)}" ${f.ph?`placeholder="${esc(f.ph)}"`:''}>`;
  return `<label class="f${f.wide?' wide':''}">${f.l}${inner}</label>`}
function inl(coll,id,k,opts,cur){return `<select aria-label="${k}" onchange="setF('${coll}','${id}','${k}',this.value)">${optHtml(opts,cur)}</select>`}
const CFG={};
function crud(key,c){
  CFG[key]=c;const rows=S[c.coll].filter(c.filter||(()=>true));let h='';
  if(!c.noAdd)h+=`<form class="add" onsubmit="return addRow(event,'${key}')">${c.fields.map(fieldHtml).join('')}<div><button class="btn">${c.add||'Add'}</button></div></form>`;
  const heads=c.cols.map(x=>x[0]);if(!c.noDel)heads.push('');
  h+=table(heads,rows.map(r=>{const a=c.cols.map(x=>x[1](r));if(!c.noDel)a.push(`<button class="btn g s" onclick="delRow('${c.coll}','${r.id}')">Delete</button>`);return a}),c.empty,c.num||[]);
  return h}
function addRow(e,key){
  e.preventDefault();const c=CFG[key];const fd=new FormData(e.target);const o={id:uid(),...(typeof c.def==='function'?c.def():c.def||{})};
  c.fields.forEach(f=>{let v=fd.get(f.k);if(f.t==='number')v=+v||0;o[f.k]=v});
  if(c.valid){const err=c.valid(o);if(err){toast(err);return false}}
  S[c.coll].push(o);c.after&&c.after(o);save();toast(c.msg||'Added');render();return false}
function delRow(coll,id){S[coll]=S[coll].filter(x=>x.id!==id);save();toast('Deleted');render()}
function setF(coll,id,k,v){const o=S[coll].find(x=>x.id===id);if(!o)return;o[k]=v;
  if(coll==='reqs'&&v==='Posted')mark('reqPosted');
  if(coll==='leaves'){o.decidedBy='hr';o.decidedAt=Date.now();audit(v+' leave for '+(emp(o.empId)?.name||''));if(v==='Approved')mark('leaveApproved')}
  save();toast('Updated');render()}

function taxCalc(monthly,sso){const inc=monthly*12,exp=Math.min(inc*.5,100000),allow=60000,ss=sso*12,taxable=Math.max(0,inc-exp-allow-ss);let t=0,prev=0;for(const[cap,r]of (BR||[[150000,0],[300000,.05],[500000,.10],[750000,.15],[1000000,.20],[2000000,.25],[5000000,.30],[Infinity,.35]])){if(taxable>prev)t+=(Math.min(taxable,cap)-prev)*r;prev=cap}return{inc,exp,allow,ss,taxable,annual:t,monthly:t/12}}

budget:{d:'Planned cost comes from approved headcount times budget salary. Actual cost comes from the salaries of people in those positions.',r(){
  let tp=0,ta=0;const rows=S.units.map(u=>{const ps=S.positions.filter(p=>p.unit===u.id);const plan=ps.reduce((s,p)=>s+p.salary*p.headcount,0);const act=active().filter(e=>ps.some(p=>p.id===e.positionId)).reduce((s,e)=>s+e.salary,0);tp+=plan;ta+=act;return [esc(u.name),money(plan),money(act),money(plan-act),money(plan*12)]});
  const tot=[ '<b>Total</b>',money(tp),money(ta),money(tp-ta),money(tp*12)];tot.cls='tot';rows.push(tot);
  return table(['Unit','Planned per month','Actual per month','Unused budget','Planned per year'],rows,'',[1,2,3,4])+`<p class="note">Unused budget is roughly the cost of your vacancies. Try raising a headcount in Position management and watch this table change.</p>`}},

  let h=table(['Code','Name','Position','Unit','Hired','Status',''],S.employees.map(e=>[esc(e.code),esc(e.name),posT(e.positionId),esc(unit(pos(e.positionId)?.unit)?.name),esc(e.hireDate),pill(e.status),`<button class="btn g s" onclick="ui.view='${e.id}';render()">View</button>`]));
  const e=emp(ui.view);
  if(e){const p=payLine(e,ui.pm);h=`<div class="panel" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h3>${esc(e.name)} (${esc(e.code)})</h3><button class="btn g s" onclick="ui.view='';render()">Close</button></div>
  <div class="grid2"><dl class="kv"><dt>Position</dt><dd>${posT(e.positionId)}</dd><dt>Status</dt><dd>${pill(e.status)}</dd><dt>Hire date</dt><dd>${esc(e.hireDate)}</dd><dt>Reports to</dt><dd>${mgrName(e.managerId)}</dd><dt>Email</dt><dd>${esc(e.email)}</dd><dt>Phone</dt><dd>${esc(e.phone)||'<span class="m">Missing</span>'}</dd><dt>Salary</dt><dd>${money(e.salary)}</dd></dl>
  <dl class="kv"><dt>Contracts (3)</dt><dd>${S.contracts.filter(k=>k.empId===e.id).map(k=>esc(k.type)).join(', ')||'None'}</dd><dt>Documents (3)</dt><dd>${S.docs.filter(d=>d.empId===e.id).length} on file</dd><dt>Courses (4)</dt><dd>${S.enrollments.filter(n=>n.empId===e.id).map(n=>esc(S.courses.find(c=>c.id===n.courseId)?.title)).join(', ')||'None'}</dd><dt>KPIs (5)</dt><dd>${S.kpis.filter(k=>k.empId===e.id).length}</dd><dt>Net pay (6)</dt><dd>${money(p.net)} for ${ui.pm}</dd><dt>Leave (7)</dt><dd>${S.leaves.filter(l=>l.empId===e.id).length} request(s)</dd></dl></div>
  <p class="note">Numbers in brackets are the module each piece of data comes from.</p></div>`+h}
  return h}},

docs:{d:'Track the documents each new hire must hand in. Change status to Verified once HR has checked the original.',r(){
  return crud('docs',{coll:'docs',fields:[{k:'empId',l:'Employee',o:empOpts,req:1},{k:'name',l:'Document',o:['ID card copy','House registration','Degree certificate','Bank book','Medical certificate','Photo'],req:1}],def:{status:'Pending'},
  cols:[['Employee',r=>empName(r.empId)],['Document',r=>esc(r.name)],['Status',r=>inl('docs',r.id,'status',['Pending','Verified'],r.status)]],add:'Add document',msg:'Document added'})}},

contracts:{d:'New hires start on a probation contract. Add a Permanent contract when they pass probation.',r(){
  return crud('contracts',{coll:'contracts',fields:[{k:'empId',l:'Employee',o:empOpts,req:1},{k:'type',l:'Contract type',o:['Probation','Permanent','Fixed-term'],req:1},{k:'start',l:'Start date',t:'date',req:1,v:today()},{k:'end',l:'End date (optional)',t:'date'}],def:{status:'Active'},
  cols:[['Employee',r=>empName(r.empId)],['Type',r=>pill(r.type)],['Start',r=>esc(r.start)],['End',r=>esc(r.end)||'Open-ended'],['Status',r=>inl('contracts',r.id,'status',['Active','Ended'],r.status)]],add:'Add contract',msg:'Contract added'})}},

orientation:{d:'Each new hire gets an orientation checklist. Hiring from the ATS creates one automatically.',r(){
  const IT=['Company policies and PDPA briefing','IT account and email set up','Meet the team and buddy','Workplace safety briefing','Benefits and payroll explained'];
  const ids=Object.keys(S.orient).filter(id=>emp(id));
  if(!ids.length)return '<p class="empty">No new hires yet. Hire someone in the ATS to start an orientation checklist.</p>';
  return table(['Employee',...IT,'Progress'],ids.map(id=>{const o=S.orient[id];const n=IT.filter((_,i)=>o[i]).length;return [empName(id),...IT.map((t,i)=>`<input type="checkbox" aria-label="${esc(t)}" ${o[i]?'checked':''} onchange="S.orient['${id}'][${i}]=this.checked;save();render()">`),`<div class="bar"><i style="width:${n/IT.length*100}%"></i></div>`]}))}},

ess:{d:'In self-service, employees keep their own details up to date instead of HR typing them in. Sign out and sign in as an employee to try it in the employee portal.',r(){
  const F=[['phone','Mobile phone'],['address','Home address'],['bank','Bank account for salary'],['emergency','Emergency contact']];
  if(isHR()){return `<p class="note">You're viewing as HR admin. This shows how complete each employee's self-service profile is.</p>`+table(['Employee',...F.map(f=>f[1]),'Complete'],active().map(e=>{const n=F.filter(f=>e[f[0]]).length;return [esc(e.name),...F.map(f=>e[f[0]]?'✓':pill('Missing')),`${n} / 4`]}))}
  const e=emp(S.me);if(!e)return '<p class="empty">Choose an employee in the header.</p>';
  return `<div class="panel" style="max-width:640px"><h3>My profile: ${esc(e.name)}</h3><form class="add" style="border:0;padding:0;margin:0" onsubmit="return saveESS(event)">${F.map(f=>fieldHtml({k:f[0],l:f[1],v:e[f[0]],req:1,wide:f[0]==='address'})).join('')}<div><button class="btn">Save my details</button></div></form></div>`}},

lms:{d:'An overview of training activity across the company, built from registrations and learning records.',r(){
  const rows=S.courses.map(c=>{const en=S.enrollments.filter(n=>n.courseId===c.id);const done=en.filter(n=>n.status==='Completed');const avg=done.length?done.reduce((s,n)=>s+(+n.score||0),0)/done.length:0;const pct=en.length?done.length/en.length*100:0;return [esc(c.title),esc(c.mode),en.length,done.length,`<div class="bar"><i style="width:${pct}%"></i></div>`,done.length?Math.round(avg):'None']});
  const hrs=S.enrollments.filter(n=>n.status==='Completed').reduce((s,n)=>s+(+S.courses.find(c=>c.id===n.courseId)?.hours||0),0);
  return `<div class="stats"><div class="stat"><b>${S.courses.length}</b><span>Courses</span></div><div class="stat"><b>${S.enrollments.length}</b><span>Registrations</span></div><div class="stat"><b>${num(hrs)}</b><span>Training hours completed</span></div></div>`+table(['Course','Mode','Registered','Completed','Completion','Avg score'],rows,'',[2,3,5])}},

catalog:{d:'Each course builds one competency. That link is what lets module 4 close the gaps found in Competency management.',r(){
  return crud('catalog',{coll:'courses',fields:[{k:'title',l:'Course title',req:1},{k:'hours',l:'Hours',t:'number',req:1},{k:'comp',l:'Builds competency',o:()=>S.comps,req:1},{k:'mode',l:'Mode',o:['Online','Classroom','On the job'],req:1}],
  cols:[['Course',r=>esc(r.title)],['Hours',r=>r.hours],['Competency',r=>esc(r.comp)],['Mode',r=>esc(r.mode)]],num:[1],add:'Add course',msg:'Course added'})}},

register:{d:'Employees sign up for courses themselves; HR can also register people directly.',r(){
  if(!isHR()){const me=S.me;return table(['Course','Hours','Competency','Mode',''],S.courses.map(c=>{const n=S.enrollments.find(x=>x.empId===me&&x.courseId===c.id);return [esc(c.title),c.hours,esc(c.comp),esc(c.mode),n?pill(n.status):`<button class="btn t s" onclick="enroll('${me}','${c.id}')">Register</button>`]}),'',[1])}
  return `<form class="add" onsubmit="return regHR(event)">${fieldHtml({k:'empId',l:'Employee',o:empOpts,req:1})}${fieldHtml({k:'courseId',l:'Course',o:courseOpts,req:1})}<div><button class="btn">Register</button></div></form>`+table(['Employee','Course','Status'],S.enrollments.map(n=>[empName(n.empId),esc(S.courses.find(c=>c.id===n.courseId)?.title),pill(n.status)]))}},

records:{d:'When someone finishes a course, record their score. Completed courses count toward training hours.',r(){
  const mine=isHR()?S.enrollments:S.enrollments.filter(n=>n.empId===S.me);
  return table(['Employee','Course','Hours','Status','Score',''],mine.map(n=>{const c=S.courses.find(x=>x.id===n.courseId);return [empName(n.empId),esc(c?.title),c?.hours,pill(n.status),n.score===''?'None':n.score,n.status==='Registered'&&isHR()?`<span style="display:flex;gap:6px"><input type="number" min="0" max="100" id="sc_${n.id}" placeholder="Score" style="width:80px" aria-label="Score"><button class="btn s" onclick="complete('${n.id}')">Mark complete</button></span>`:'']}),'No learning records yet.',[2,4])}},

competency:{d:'Rate each person from 0 (none) to 4 (expert). Highlighted cells are gaps below 2 that training should close.',r(){
  const lv=['0','1','2','3','4'];
  return `<div class="tw"><table><thead><tr><th>Employee</th>${S.comps.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${active().map(e=>`<tr><td>${esc(e.name)}<div class="m" style="font-size:12px;color:var(--muted)">${posT(e.positionId)}</div></td>${S.comps.map((c,i)=>{const v=S.levels[e.id+'|'+i]??0;return `<td class="${v<2?'low':''}"><select aria-label="${esc(c)}" onchange="S.levels['${e.id}|${i}']=+this.value;save();render()">${optHtml(lv,v)}</select></td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}},

kpi:{d:'Set weighted KPIs for each employee. Weights for one person should add up to 100.',r(){
  return crud('kpi',{coll:'kpis',fields:[{k:'empId',l:'Employee',o:empOpts,req:1},{k:'name',l:'KPI',req:1,ph:'Customer satisfaction score'},{k:'weight',l:'Weight (%)',t:'number',req:1},{k:'target',l:'Target',t:'number',req:1},{k:'actual',l:'Actual so far',t:'number'}],
  valid:o=>{const w=S.kpis.filter(k=>k.empId===o.empId).reduce((s,k)=>s+(+k.weight),0)+o.weight;return w>100?`Weights for this employee would total ${w}%. Keep it at 100% or less.`:''},
  cols:[['Employee',r=>empName(r.empId)],['KPI',r=>esc(r.name)],['Weight',r=>r.weight+'%'],['Target',r=>num(r.target)],['Actual',r=>num(r.actual)],['Achieved',r=>Math.round((+r.actual||0)/(+r.target||1)*100)+'%']],num:[2,3,4,5],add:'Add KPI',msg:'KPI added',after:()=>mark('kpi')})}},

appraisal:{d:'Final score = 70% KPI result + 30% average 360 rating, on a 5-point scale. Achievement per KPI is capped at 120%.',r(){
  const ids=[...new Set([...S.kpis.map(k=>k.empId),...S.feedback.map(f=>f.empId)])].filter(id=>emp(id));
  const rows=ids.map(id=>{const ks=S.kpis.filter(k=>k.empId===id);const w=ks.reduce((s,k)=>s+(+k.weight),0);const kp=w?ks.reduce((s,k)=>s+(+k.weight)*Math.min((+k.actual||0)/(+k.target||1),1.2),0)/w:0;const fb=S.feedback.filter(f=>f.empId===id);const f=fb.length?fb.reduce((s,x)=>s+(+x.rating),0)/fb.length:0;
    const final=(ks.length&&fb.length)?kp*5*.7+f*.3:(ks.length?kp*5:f);const g=final>=4.5?'A':final>=3.5?'B':final>=2.5?'C':'D';
    return [empName(id),ks.length?Math.round(kp*100)+'%':'None',fb.length?f.toFixed(1):'None',final.toFixed(2),`<b>${g}</b>`]});
  return table(['Employee','KPI result','360 average','Final (out of 5)','Grade'],rows,'No KPIs or feedback yet. Start in KPI management.',[1,2,3])+`<p class="note">Grades: A from 4.5, B from 3.5, C from 2.5, otherwise D. Discuss with your class whether these weights are fair for every role.</p>`}},

f360:{d:'Collect ratings from the employee, their manager, peers and team members. The average feeds into the appraisal.',r(){
  return crud('f360',{coll:'feedback',fields:[{k:'empId',l:'About employee',o:empOpts,req:1},{k:'source',l:'Rater',o:['Self','Manager','Peer','Subordinate'],req:1},{k:'rating',l:'Rating',o:[['5','5'],['4','4'],['3','3'],['2','2'],['1','1']],req:1},{k:'comment',l:'Comment',wide:1}],
  cols:[['Employee',r=>empName(r.empId)],['Rater',r=>esc(r.source)],['Rating',r=>r.rating+' / 5'],['Comment',r=>esc(r.comment)]],add:'Add feedback',msg:'Feedback added'})}},

career:{d:'Record where each person wants to go next and what development will get them there.',r(){
  return crud('career',{coll:'careers',fields:[{k:'empId',l:'Employee',o:empOpts,req:1},{k:'target',l:'Target position',o:posOpts,req:1},{k:'timeline',l:'Timeline',o:['Within 1 year','1 to 2 years','2 to 3 years','3+ years'],req:1},{k:'action',l:'Development action',wide:1,req:1}],
  cols:[['Employee',r=>empName(r.empId)],['Current',r=>posT(emp(r.empId)?.positionId)],['Target',r=>posT(r.target)],['Timeline',r=>esc(r.timeline)],['Development action',r=>esc(r.action)]],add:'Add career plan',msg:'Career plan added'})+goalsHR()}},

succession:{d:'Name successors for key roles. Management positions without a successor are flagged as a risk.',r(){
  const risk=S.positions.filter(p=>p.grade.startsWith('M')&&!S.succession.some(s=>s.positionId===p.id));
  return `<div class="hint" style="margin-top:0">${risk.length?`Positions with no successor: ${risk.map(p=>esc(p.title)).join(', ')}`:'Every management position has at least one successor.'}</div>`+
  crud('succession',{coll:'succession',fields:[{k:'positionId',l:'Key position',o:posOpts,req:1},{k:'empId',l:'Candidate',o:empOpts,req:1},{k:'readiness',l:'Readiness',o:['Ready now','1 to 2 years','3+ years'],req:1}],
  cols:[['Position',r=>posT(r.positionId)],['Incumbent',r=>active().filter(e=>e.positionId===r.positionId).map(e=>esc(e.name)).join(', ')||'Vacant'],['Candidate',r=>empName(r.empId)],['Readiness',r=>pill(r.readiness)]],add:'Add successor',msg:'Successor added'})}},

payroll:{d:'Pay is calculated from salary, OT and bonuses, minus social security and withholding tax. Run payroll to lock in the month.',r(){
  let T={salary:0,ot:0,bonus:0,gross:0,sso:0,tax:0,net:0};
  const rows=active().map(e=>{const p=payLine(e,ui.pm);for(const k in T)T[k]+=p[k];return [esc(e.code),esc(e.name),money(p.salary),money(p.ot),money(p.bonus),money(p.gross),money(p.sso),money(p.tax),`<b>${money(p.net)}</b>`]});
  const t=['','<b>Total</b>',money(T.salary),money(T.ot),money(T.bonus),money(T.gross),money(T.sso),money(T.tax),money(T.net)];t.cls='tot';rows.push(t);
  const ran=S.payrolls.find(p=>p.month===ui.pm);
  return `<div class="add" style="display:flex;flex-wrap:wrap;gap:12px;align-items:end"><label class="f">Pay month<input type="month" value="${ui.pm}" onchange="ui.pm=this.value||ui.pm;render()"></label><button class="btn t" onclick="runPayroll()">${ran?'Run payroll again':'Run payroll'}</button>${ran?`<span class="note">Last run ${esc(ran.date)}</span>`:''}</div>`+
  table(['Code','Employee','Salary','OT','Bonus','Gross','Social security','Tax','Net pay'],rows,'',[2,3,4,5,6,7,8])+
  `<h2>Payroll history</h2>`+table(['Month','Run on','Employees','Total net pay'],S.payrolls.map(p=>[esc(p.month),esc(p.date),p.count,money(p.total)]),'No payroll has been run yet.',[2,3])}},

ot:{d:'OT pay = hours x hourly rate x multiplier. Hourly rate = monthly salary / 30 / 8. Multipliers follow Thai labour law: 1.5 on workdays, 3 on holidays.',r(){
  return crud('ot',{coll:'ot',fields:[{k:'empId',l:'Employee',o:empOpts,req:1},{k:'date',l:'Date',t:'date',req:1,v:today()},{k:'hours',l:'Hours',t:'number',req:1},{k:'mult',l:'Rate',o:[['1.5','1.5x workday OT'],['2','2x holiday work'],['3','3x holiday OT']],req:1}],
  cols:[['Employee',r=>empName(r.empId)],['Date',r=>esc(r.date)],['Hours',r=>r.hours],['Rate',r=>r.mult+'x'],['OT pay',r=>money(otPay(r))]],num:[2,3,4],add:'Record OT',msg:'OT recorded'})}},

bonus:{d:'Bonuses are paid in the month you choose and appear in that month\'s payroll.',r(){
  return crud('bonus',{coll:'bonuses',fields:[{k:'empId',l:'Employee',o:empOpts,req:1},{k:'month',l:'Pay month',t:'month',req:1,v:'2026-09'},{k:'amount',l:'Amount (THB)',t:'number',req:1},{k:'reason',l:'Reason',req:1}],
  cols:[['Employee',r=>empName(r.empId)],['Month',r=>esc(r.month)],['Amount',r=>money(r.amount)],['Reason',r=>esc(r.reason)]],num:[2],add:'Add bonus',msg:'Bonus added'})}},

tax:{d:'A simplified personal income tax estimate for teaching: 50% expense deduction up to ฿100,000, ฿60,000 personal allowance, social security deduction, then progressive rates. Real withholding uses more allowances.',r(){
  const rows=active().map(e=>{const t=taxCalc(e.salary,ssoOf(e.salary));return [esc(e.name),money(t.inc),money(t.exp),money(t.allow),money(t.ss),money(t.taxable),money(t.annual),money(t.monthly)]});
  return table(['Employee','Annual income','Expenses','Personal allowance','Social security','Taxable income','Annual tax','Withheld per month'],rows,'',[1,2,3,4,5,6,7])+
  `<h2>Tax brackets used</h2>`+table(['Taxable income','Rate'],[['0 to 150,000','0%'],['150,001 to 300,000','5%'],['300,001 to 500,000','10%'],['500,001 to 750,000','15%'],['750,001 to 1,000,000','20%'],['1,000,001 to 2,000,000','25%'],['2,000,001 to 5,000,000','30%'],['Over 5,000,000','35%']],'',[1])}},

sso:{d:'Employee and employer each contribute the same amount. Rates are settings, not code, because the government changes them.',r(){
  const s=S.settings;let te=0;
  const rows=active().map(e=>{const c=ssoOf(e.salary);te+=c;return [esc(e.name),money(e.salary),money(Math.min(Math.max(e.salary,s.ssoFloor),s.ssoCap)),money(c),money(c),money(c*2)]});
  const t=['<b>Total</b>','','',money(te),money(te),money(te*2)];t.cls='tot';rows.push(t);
  return `<form class="add" onsubmit="return saveSSO(event)">${fieldHtml({k:'ssoRate',l:'Contribution rate (%)',t:'number',v:s.ssoRate,req:1})}${fieldHtml({k:'ssoFloor',l:'Minimum wage base (THB)',t:'number',v:s.ssoFloor,req:1})}${fieldHtml({k:'ssoCap',l:'Maximum wage base (THB)',t:'number',v:s.ssoCap,req:1})}<div><button class="btn">Save rates</button></div></form>
  <p class="note">Defaults follow the 2026 rules for Section 33 insured employees: 5% on a wage base capped at ฿17,500, so at most ฿875 a month. The cap is scheduled to rise to ฿20,000 and later ฿23,000; try changing it and watch payroll update.</p>`+
  table(['Employee','Salary','Wage base','Employee pays','Employer pays','Total to fund'],rows,'',[1,2,3,4,5])}},

leave:{d:'Employees request leave in the portal and their manager decides; HR can decide any request. Quotas here follow Thai minimums: 30 sick days, 6 annual days, 3 personal business days per year.',r(){
  const bal=id=>Object.keys(QUOTA).map(t=>{const used=S.leaves.filter(l=>l.empId===id&&l.type===t&&l.status==='Approved').reduce((s,l)=>s+days(l.from,l.to),0);return `${t} ${QUOTA[t]-used}/${QUOTA[t]}`}).join(', ');
  if(!isHR()){const me=S.me;CFG.leave={coll:'leaves',fields:[{k:'type',l:'Leave type',o:Object.keys(QUOTA),req:1},{k:'from',l:'From',t:'date',req:1},{k:'to',l:'To',t:'date',req:1},{k:'reason',l:'Reason',req:1}],def:{empId:me,status:'Pending'},valid:o=>o.to<o.from?'The end date is before the start date.':'',msg:'Leave requested'};
    return `<div class="hint" style="margin-top:0">Days remaining: ${bal(me)}</div><form class="add" onsubmit="return addRow(event,'leave')">${CFG.leave.fields.map(fieldHtml).join('')}<div><button class="btn">Request leave</button></div></form>`+
    table(['Type','From','To','Days','Reason','Status'],S.leaves.filter(l=>l.empId===me).map(l=>[esc(l.type),esc(l.from),esc(l.to),days(l.from,l.to),esc(l.reason),pill(l.status)]),'You have no leave requests yet.',[3])}
  return table(['Employee','Type','From','To','Days','Reason','Balance','Status'],S.leaves.map(l=>[empName(l.empId),esc(l.type),esc(l.from),esc(l.to),days(l.from,l.to),esc(l.reason),`<span class="note">${bal(l.empId)}</span>`,l.status==='Pending'?`<span style="display:flex;gap:6px"><button class="btn t s" onclick="setF('leaves','${l.id}','status','Approved')">Approve</button><button class="btn g s" onclick="setF('leaves','${l.id}','status','Rejected')">Reject</button></span>`:pill(l.status)+(l.decidedBy?`<br><span class="m" style="font-size:12px">by ${whoName(l.decidedBy)}</span>`:'')]),'No leave requests yet. Employees submit them from the employee portal.',[4])}},

grievance:{d:'Anyone can raise a concern, named or anonymous. HR tracks each case until it is resolved.',r(){
  const c={coll:'grievances',fields:[{k:'subject',l:'What happened?',req:1,wide:1},{k:'cat',l:'Category',o:['Workplace','Manager or colleague','Pay and benefits','Harassment','Other'],req:1},{k:'anon',l:'Submit as',o:[['named','My name'],['anon','Anonymous']],req:1}],
    def:()=>({status:'Open',date:today()}),after:o=>{o.empId=o.anon==='anon'?'':(isHR()?'':S.me)},msg:'Grievance submitted',
    cols:[['Date',r=>esc(r.date)],['From',r=>empName(r.empId)],['Category',r=>esc(r.cat)],['Subject',r=>esc(r.subject)],['Status',r=>isHR()?inl('grievances',r.id,'status',['Open','Investigating','Resolved'],r.status):pill(r.status)]],add:'Submit',noDel:!isHR()};
  return crud('grievance',c)}},

engagement:{d:'A three-question pulse survey. Low average scores point to where HR should act.',r(){
  const Q=[['q1','I would recommend this company as a place to work'],['q2','I have what I need to do my job well'],['q3','I can see a future for myself here']];
  const avg=k=>S.surveys.length?S.surveys.reduce((s,v)=>s+(+v[k]),0)/S.surveys.length:0;
  CFG.engagement={coll:'surveys',fields:[...(isHR()?[{k:'empId',l:'Respondent',o:empOpts,req:1}]:[]),...Q.map(q=>({k:q[0],l:q[1],o:[['5','5 Strongly agree'],['4','4 Agree'],['3','3 Neutral'],['2','2 Disagree'],['1','1 Strongly disagree']],req:1}))],def:()=>isHR()?{}:{empId:S.me},msg:'Response recorded'};
  return `<form class="add" onsubmit="return addRow(event,'engagement')">${CFG.engagement.fields.map(fieldHtml).join('')}<div><button class="btn">Submit response</button></div></form><h2>Results (${S.surveys.length} responses)</h2>`+
  table(['Question','Average','',''],Q.map(q=>{const a=avg(q[0]);return [esc(q[1]),a.toFixed(1)+' / 5',`<div class="bar" style="width:160px"><i style="width:${a/5*100}%"></i></div>`,a<3.5?pill('Needs attention'):'']}),'',[1])}},

exit:{d:'Recording an exit interview also ends the person\'s employment and moves them to the alumni database.',r(){
  return `<form class="add" onsubmit="return doExit(event)">${fieldHtml({k:'empId',l:'Leaving employee',o:empOpts,req:1})}${fieldHtml({k:'date',l:'Last working day',t:'date',req:1,v:today()})}${fieldHtml({k:'reason',l:'Main reason',o:['Career growth','Pay and benefits','Relocation','Work-life balance','Relationship with manager','Retirement','Other'],req:1})}${fieldHtml({k:'rehire',l:'Eligible for rehire',o:['Yes','No'],req:1})}${fieldHtml({k:'notes',l:'Interview notes',t:'area',wide:1})}<div><button class="btn">Record exit</button></div></form>`+

function calcLine(e,st,m){const hourly=e.salary/30/8;
  const ot=(st.ot||[]).filter(o=>o.empId===e.id&&(o.date||'').startsWith(m)).reduce((s,o)=>s+o.hours*hourly*(+o.mult),0);
  const bonus=(st.bonuses||[]).filter(b=>b.empId===e.id&&b.month===m).reduce((s,b)=>s+(+b.amount||0),0);
  const se=st.settings;const sso=Math.min(Math.max(e.salary,se.ssoFloor),se.ssoCap)*se.ssoRate/100;const tax=taxCalc(e.salary,sso).monthly;const gross=e.salary+ot+bonus;
  return{salary:e.salary,ot,bonus,gross,sso,tax,net:gross-sso-tax}}

function migrate(st){if(!st)return seed();const b=seed();
  (st.employees||[]).forEach(e=>{if(e.managerId===undefined){const be=b.employees.find(x=>x.id===e.id);e.managerId=be?be.managerId:hireManager(e.positionId,st)}});
  if(!st.holidays)st.holidays=b.holidays;if(!st.goals)st.goals=b.goals;if(!st.audit)st.audit=[];if(!st.lastLogin)st.lastLogin={};
  st.payrolls=st.payrolls||[];if(!st.payrolls.some(p=>p.lines))b.payrolls.forEach(p=>{if(!st.payrolls.some(x=>x.month===p.month))st.payrolls.push(p)});
  st.v=2;return st}
function workDays(a,b){if(!a||!b||b<a)return 0;const H=new Set((S.holidays||[]).map(h=>h.date));let n=0;const pad=x=>String(x).padStart(2,'0');
  for(let d=new Date(a+'T00:00:00');d<=new Date(b+'T00:00:00');d.setDate(d.getDate()+1)){const w=d.getDay();const iso=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());if(w!==0&&w!==6&&!H.has(iso))n++}return n}

const ME=()=>SESSION&&SESSION.kind==='emp'?emp(SESSION.id):null;
const reports=id=>active().filter(e=>e.managerId===id);
const isMgr=id=>reports(id).length>0;
const roleOf=()=>!SESSION?'':SESSION.kind==='hr'?'HR admin':isMgr(SESSION.id)?'Manager':'Employee';
const mgrName=id=>id&&emp(id)?esc(emp(id).name):'<span class="m">None (top of organization)</span>';
const whoName=w=>w==='hr'?'HR administrator':w?esc(emp(w)?.name||'Unknown'):'Signed out';
function audit(action,ok=true){S.audit=S.audit||[];S.audit.unshift({at:Date.now(),who:SESSION?(SESSION.kind==='hr'?'hr':SESSION.id):'',action,ok});if(S.audit.length>300)S.audit.length=300}

/* scoped data access: the only way portal screens read data */
const my={
  emp:()=>ME(),
  leaves:()=>S.leaves.filter(l=>l.empId===SESSION.id),
  payslips:()=>S.payrolls.filter(p=>p.lines&&p.lines.some(l=>l.empId===SESSION.id)).map(p=>({month:p.month,date:p.date,line:p.lines.find(l=>l.empId===SESSION.id)})).sort((a,b)=>b.month.localeCompare(a.month)),
  kpis:()=>S.kpis.filter(k=>k.empId===SESSION.id),
  goals:()=>S.goals.filter(g=>g.empId===SESSION.id),
  contracts:()=>S.contracts.filter(k=>k.empId===SESSION.id),
  training:()=>S.enrollments.filter(n=>n.empId===SESSION.id),
  team:()=>reports(SESSION.id),
  teamLeaves:()=>{const ids=reports(SESSION.id).map(e=>e.id);return S.leaves.filter(l=>ids.includes(l.empId))}
};
const leaveUsed=(id,type,st='Approved')=>S.leaves.filter(l=>l.empId===id&&l.type===type&&l.status===st&&String(l.from).startsWith('2026')).reduce((s,l)=>s+workDays(l.from,l.to),0);
const leaveLeft=(id,type)=>QUOTA[type]-leaveUsed(id,type);
function apprOf(id){const ks=S.kpis.filter(k=>k.empId===id);const w=ks.reduce((s,k)=>s+(+k.weight),0);const kp=w?ks.reduce((s,k)=>s+(+k.weight)*Math.min((+k.actual||0)/(+k.target||1),1.2),0)/w:0;
  const fb=S.feedback.filter(f=>f.empId===id);const f=fb.length?fb.reduce((s,x)=>s+(+x.rating),0)/fb.length:0;if(!ks.length&&!fb.length)return null;
  const final=(ks.length&&fb.length)?kp*5*.7+f*.3:(ks.length?kp*5:f);return{kp,f,final,grade:final>=4.5?'A':final>=3.5?'B':final>=2.5?'C':'D',nk:ks.length,nf:fb.length}}
const mname=m=>{const[y,mm]=m.split('-');return new Date(+y,+mm-1,1).toLocaleString('en-GB',{month:'long',year:'numeric'})};

/* ---------- sign in / out ---------- */
function signIn(kind,id){
  if(kind==='emp'){const e=emp(id);if(!e||e.status!=='Active'){toast('This account is disabled.');return}}
  SESSION=kind==='hr'?{kind:'hr'}:{kind:'emp',id};S.lastLogin=S.lastLogin||{};S.lastLogin[kind==='hr'?'hr':id]=Date.now();audit('Signed in as '+roleOf());ui.lastDeny='';ui.slip='';ui.tm='';save();
  const target=kind==='hr'?'home':'me';if(location.hash.slice(1)===target)render();else location.hash=target}
function signOut(){audit('Signed out');SESSION=null;save();if(location.hash.slice(1)==='login')render();else location.hash='login'}

/* ---------- portal actions (each re-checks who is signed in) ---------- */
function saveMyProfile(e){e.preventDefault();const m=ME();if(!m)return false;const fd=new FormData(e.target);['phone','address','bank','emergency'].forEach(k=>m[k]=fd.get(k).trim());audit('Updated own contact details');mark('ess');save();toast('Your details are saved');render();return false}
function submitLeave(e){e.preventDefault();const m=ME();if(!m)return false;const fd=new FormData(e.target);const o={id:uid(),empId:m.id,type:fd.get('type'),from:fd.get('from'),to:fd.get('to'),reason:fd.get('reason').trim(),status:'Pending',approver:m.managerId||'hr',at:Date.now()};
  if(o.to<o.from){toast('The end date is before the start date.');return false}
  const wd=workDays(o.from,o.to);if(!wd){toast('Those dates are all weekends or company holidays.');return false}
  if(wd>leaveLeft(m.id,o.type)-leaveUsed(m.id,o.type,'Pending')){toast(`Not enough ${o.type.toLowerCase()} leave left for ${wd} working day${wd>1?'s':''}.`);return false}
  if(my.leaves().some(l=>['Pending','Approved'].includes(l.status)&&!(o.to<l.from||o.from>l.to))){toast('You already have leave on some of those dates.');return false}
  S.leaves.push(o);audit(`Requested ${wd} day(s) of ${o.type.toLowerCase()} leave`);save();toast(`Request sent to ${o.approver==='hr'?'HR':emp(o.approver)?.name}`);render();return false}
function cancelLeave(id){const l=S.leaves.find(x=>x.id===id);if(!l||l.empId!==SESSION.id||l.status!=='Pending'){toast('Access denied');return}l.status='Cancelled';audit('Cancelled own leave request');save();render()}
function mgrDecide(id,st){const l=S.leaves.find(x=>x.id===id);
  if(!l||!reports(SESSION.id).some(r=>r.id===l.empId)){audit('Blocked: tried to decide leave outside own team',false);save();toast('Access denied: you can only decide leave for your direct reports.');render();return}
  l.status=st;l.decidedBy=SESSION.id;l.decidedAt=Date.now();audit(`${st} leave for ${emp(l.empId)?.name}`);if(st==='Approved')mark('mgrApproved');save();toast(`Leave ${st.toLowerCase()}`);render()}
function addGoal(e){e.preventDefault();const fd=new FormData(e.target);S.goals.push({id:uid(),empId:SESSION.id,title:fd.get('title').trim(),type:fd.get('type'),due:fd.get('due'),status:'Not started'});audit('Added a personal goal');save();toast('Goal added');render();return false}
function setGoal(id,k,v){const g=S.goals.find(x=>x.id===id);if(!g||g.empId!==SESSION.id){toast('Access denied');return}g[k]=v;save();render()}
function delGoal(id){const g=S.goals.find(x=>x.id===id);if(!g||g.empId!==SESSION.id){toast('Access denied');return}S.goals=S.goals.filter(x=>x!==g);save();render()}
function openSlip(m){ui.slip=m;const s=my.payslips().find(x=>x.month===m);if(s){audit('Viewed own payslip for '+m);mark('payslip');save()}render()}
function setManager(id,mid){if(mid===id){toast('Someone cannot report to themselves.');render();return}
  let cur=mid,guard=0;while(cur&&guard++<50){if(cur===id){toast('That would create a loop in the reporting line.');render();return}cur=emp(cur)?.managerId}
  const e=emp(id);e.managerId=mid;audit(`Changed reporting line: ${e.name} now reports to ${mid?emp(mid).name:'no one'}`);save();toast('Reporting line updated');render()}

  const t=my.team();const sel=t.find(x=>x.id===ui.tm);
  let card='';if(sel){const a=apprOf(sel.id);card=`<div class="panel" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h3>${esc(sel.name)}</h3><button class="btn g s" onclick="ui.tm='';render()">Close</button></div>
    <div class="grid2"><dl class="kv"><dt>Position</dt><dd>${posT(sel.positionId)}</dd><dt>Start date</dt><dd>${fmtD(sel.hireDate)}</dd><dt>Work email</dt><dd>${esc(sel.email)}</dd><dt>Leave left</dt><dd>${Object.keys(QUOTA).map(k=>`${k} ${leaveLeft(sel.id,k)}`).join(', ')}</dd><dt>Appraisal</dt><dd>${a?a.grade+' ('+a.final.toFixed(2)+')':'None yet'}</dd></dl>
    <div>${table(['Goal','Status'],S.goals.filter(g=>g.empId===sel.id).map(g=>[esc(g.title),pill(g.status)]),'No personal goals.')}</div></div>
    <p class="note" style="margin:10px 0 0">Hidden from managers here: salary, payslips, home address, bank account and emergency contact. Pay decisions go through HR.</p></div>`}
  return card+table(['Name','Position','Annual leave left','Pending requests','KPI result','Courses done',''],t.map(e=>{const a=apprOf(e.id);return [esc(e.name),posT(e.positionId),leaveLeft(e.id,'Annual'),S.leaves.filter(l=>l.empId===e.id&&l.status==='Pending').length,a&&a.nk?Math.round(a.kp*100)+'%':'None',S.enrollments.filter(n=>n.empId===e.id&&n.status==='Completed').length,`<button class="btn g s" onclick="ui.tm='${e.id}';render()">View</button>`]}),'',[2,3,4,5])+
  `<p class="note">You see your ${t.length} direct report${t.length===1?'':'s'} only. People further down the line, and everyone in other teams, aren't included.</p>`}},
'team-leave':{mgr:1,t:'Team leave approvals',th:'อนุมัติการลาของทีม',r(){
  const all=my.teamLeaves();const pend=all.filter(l=>l.status==='Pending');const done=all.filter(l=>l.status!=='Pending').slice().reverse();
  return `<h2 style="margin-top:0">Waiting for you (${pend.length})</h2>`+table(['Employee','Type','From','To','Working days','Reason','Days left after',''],pend.map(l=>[empName(l.empId),esc(l.type),fmtD(l.from),fmtD(l.to),workDays(l.from,l.to),esc(l.reason),leaveLeft(l.empId,l.type)-workDays(l.from,l.to),`<span style="display:flex;gap:6px"><button class="btn t s" onclick="mgrDecide('${l.id}','Approved')">Approve</button><button class="btn g s" onclick="mgrDecide('${l.id}','Rejected')">Reject</button></span>`]),'Nothing waiting for your approval.',[4,6])+
  `<h2>Decided</h2>`+table(['Employee','Type','From','To','Decided by','Status'],done.map(l=>[empName(l.empId),esc(l.type),fmtD(l.from),fmtD(l.to),l.decidedBy?whoName(l.decidedBy):'',pill(l.status)]),'No decisions yet.')}}
};
const fmtD=d=>d?new Date(d+(String(d).length===10?'T00:00:00':'')).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';

/* ---------- HR system administration ---------- */
const PERM=[['Own profile and work history','Own','Own','All employees'],['Edit contact and bank details','Own','Own','All employees'],['Salary and payslips','Own only','Own only, not team','All employees'],['Leave requests','Submit own','Submit own, decide for direct reports','Decide for anyone'],['Leave balances','Own','Own and direct reports','All employees'],['KPIs and appraisal results','Own, read only','Own and direct reports','Set and edit for all'],['Personal goals','Own, create and edit','Own, view direct reports','View all'],['Employee directory','Work fields only','Work fields only','All fields'],["Others' home address, bank and emergency contact",'No','No','Yes'],['Recruitment, hiring and exits','No','No','Yes'],['Payroll, tax and social security','No','No','Yes'],['Company-wide dashboard','No','No','Yes'],['Reporting lines and accounts','No','No','Yes'],['Audit log','No','No','Yes']];
const SY={
'sys-accounts':{t:'Accounts and reporting lines',th:'บัญชีผู้ใช้และสายบังคับบัญชา',d:'Each active employee has an account. Their role comes from the reporting line: anyone with direct reports gets manager access. Exiting an employee disables their account.',r(){
  const ll=S.lastLogin||{};const rows=[['<b>HR administrator</b>','','HR admin','',"",pill('Active'),ago(ll.hr)]];
  S.employees.forEach(e=>{const act=e.status==='Active';const opts=[['','None (top of organization)'],...active().filter(x=>x.id!==e.id).map(x=>[x.id,x.name])];
    rows.push([`${esc(e.name)}<br><span class="m" style="font-size:12px">${esc(e.code)}, ${posT(e.positionId)}</span>`,act?`<select aria-label="Reports to" onchange="setManager('${e.id}',this.value)">${optHtml(opts,e.managerId||'')}</select>`:'',act?(isMgr(e.id)?'Manager':'Employee'):'None',reports(e.id).length||'',act?'':'Exited',act?pill('Active'):pill('Disabled'),ago(ll[e.id])])});
  return table(['Account','Reports to','Role','Direct reports','','Status','Last sign-in'],rows,'',[3])}},
'sys-perm':{t:'Permission matrix',th:'ตารางสิทธิ์การเข้าถึง',d:'What each role may see or do. Sign in as each role and check that the system matches this table. The rule behind it is least privilege: each role gets only what its job needs.',r(){
  const c=v=>['Yes','No'].includes(v)?pill(v):esc(v);
  return table(['Data or function','Employee','Manager','HR admin'],PERM.map(r=>[esc(r[0]),c(r[1]),c(r[2]),c(r[3])]))}},
'sys-holidays':{t:'Holiday calendar',th:'ปฏิทินวันหยุดบริษัท',d:'Employees see these dates in their portal, and leave requests skip them when counting working days. Thai labour law requires at least 13 traditional holidays a year, including National Labour Day. The defaults follow the 2026 public holidays for private companies.',r(){
  return crud('sys-holidays',{coll:'holidays',fields:[{k:'date',l:'Date',t:'date',req:1},{k:'name',l:'Holiday name',req:1},{k:'th',l:'Thai name'}],after:()=>S.holidays.sort((a,b)=>a.date.localeCompare(b.date)),
  cols:[['Date',r=>fmtD(r.date)],['Day',r=>new Date(r.date+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short'})],['Holiday',r=>esc(r.name)],['Thai name',r=>esc(r.th)]],add:'Add holiday',msg:'Holiday added'})+`<p class="note">${(S.holidays||[]).filter(h=>h.date.startsWith('2026')).length} holidays set for 2026.</p>`}},
'sys-audit':{t:'Audit log',th:'บันทึกการเข้าถึงระบบ',d:'Every sign-in, sensitive view and blocked attempt is recorded. In a real system this log is how HR proves who saw whose data.',r(){
  const rows=(S.audit||[]).filter(a=>!ui.auditBad||!a.ok);
  return `<label class="f" style="flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--text);margin-bottom:10px"><input type="checkbox" ${ui.auditBad?'checked':''} onchange="ui.auditBad=this.checked;render()">Show blocked attempts only</label>`+
  table(['Time','Account','Action','Result'],rows.map(a=>[fmtT(a.at),whoName(a.who),esc(a.action),pill(a.ok?'Allowed':'Blocked')]),'Nothing recorded yet.')}}
};
const goalsHR=()=>`<h2>Goals employees set for themselves</h2>`+table(['Employee','Goal','Type','Target date','Status'],S.goals.map(g=>[empName(g.empId),esc(g.title),esc(g.type),fmtD(g.due),pill(g.status)]),'No employee goals yet. Employees add them in the portal.');

/* ---------- login and access denied ---------- */
function loginScreen(){
  const act=active();const mg=act.filter(e=>isMgr(e.id)),em=act.filter(e=>!isMgr(e.id)),ex=S.employees.filter(e=>e.status!=='Active');
  const card=e=>`<button class="acct" onclick="signIn('emp','${e.id}')"><b>${esc(e.name)}</b><span class="note">${posT(e.positionId)}</span>${isMgr(e.id)?`<span class="pill">Manages ${reports(e.id).length}</span>`:''}</button>`;
  return `<div style="max-width:980px"><h1>Sign in to Siam Craft HR</h1><p class="sub">เข้าสู่ระบบ (จำลอง) เลือกบัญชีที่ต้องการใช้งาน</p>
  <div class="hint">This is a practice sign-in, so there are no passwords. Choose who you want to be. Each account only sees what its role allows, so sign in as different people and compare.</div>
  <h2>HR department</h2><div class="accts"><button class="acct" onclick="signIn('hr')"><b>HR administrator</b><span class="note">Full access to all 7 HR modules and system administration</span><span class="pill">HR admin</span></button></div>
  <h2>Managers <span class="m" style="font-weight:400;font-size:14px">own data plus direct reports</span></h2><div class="accts">${mg.map(card).join('')}</div>
  <h2>Employees <span class="m" style="font-weight:400;font-size:14px">own data only</span></h2><div class="accts">${em.map(card).join('')}</div>
  ${ex.length?`<h2>Disabled accounts</h2><div class="accts">${ex.map(e=>`<button class="acct" disabled aria-disabled="true"><b>${esc(e.name)}</b><span class="note">Account disabled after exit</span></button>`).join('')}</div>`:''}
  <h2>Student tools</h2><div class="inline"><a class="btn t" href="#progress">My progress and export</a><button class="btn g" onclick="armed(this,resetData)">Reset practice company</button><a class="btn g" href="#verify">For instructors: check reports</a></div></div>`}
function deniedPage(route,reason){
  const name=ITEM[route]?.en||SY[route]?.t||PS[route]?.t||route;
  const logKey=route+'|'+(SESSION?SESSION.kind+(SESSION.id||''):'');
  if(ui.lastDeny!==logKey){ui.lastDeny=logKey;audit('Blocked: tried to open '+name,false);if(SESSION&&SESSION.kind==='emp')mark('denied');save()}
  return `<div class="denied"><p class="code403">403</p><h1>Access denied</h1><p class="sub">ไม่มีสิทธิ์เข้าถึงหน้านี้</p>
  <div class="panel" style="margin-top:16px"><dl class="kv"><dt>Page requested</dt><dd>${esc(name)}</dd><dt>Signed in as</dt><dd>${SESSION.kind==='hr'?'HR administrator':esc(ME()?.name)} (${roleOf()})</dd><dt>Why</dt><dd>${reason}</dd></dl></div>
  <div class="hint">The role check ran <b>before</b> any data for this page was loaded, so nothing from it reached your screen. This attempt was written to the audit log. Hiding a menu item isn't enough on its own; the system has to refuse the request itself.</div>
  <a class="btn" href="#${SESSION.kind==='hr'?'home':'me'}">Back to my dashboard</a></div>`}

/* ---------- render ---------- */
function renderHeader(){let h='';
  if(SESSION)h=`<span class="tag">${roleOf()}</span><span class="who">Signed in as <b style="color:#fff">${SESSION.kind==='hr'?'HR administrator':esc(ME()?.name)}</b></span><button onclick="signOut()">Sign out</button>`;
  document.getElementById('hdr').innerHTML=h}
function modNav(route){return MODULES.map(m=>`<div class="mod ${ui.openMod===m.n?'open':''}"><button class="modh" aria-expanded="${ui.openMod===m.n}" onclick="ui.openMod=ui.openMod===${m.n}?0:${m.n};render()"><span class="num">${m.n}</span><span>${m.en}<span class="th">${m.th}</span></span></button><div class="items">${m.items.map(i=>`<a class="it ${route===i[0]?'act':''}" href="#${i[0]}">${i[1]}<span>${i[2]}</span></a>`).join('')}</div></div>`).join('')}
const navLink=(k,t,th,route)=>`<a class="it ${route===k?'act':''}" href="#${k}">${t}<span>${th}</span></a>`;
function render(){
  const raw=location.hash.slice(1);const side=document.getElementById('side'),main=document.getElementById('main');
  if(SESSION&&SESSION.kind==='emp'&&!ME())SESSION=null;
  document.body.classList.toggle('portal',!!(SESSION&&SESSION.kind==='emp'));
  renderHeader();
  if(MODE==='loading'){side.innerHTML='';main.innerHTML='<p class="empty">Loading…</p>';return}
  if(raw==='progress'||raw==='verify'){
    side.innerHTML=`<a class="homelink" href="#${SESSION?(SESSION.kind==='hr'?'home':'me'):'login'}">Back to Siam Craft HR</a><a class="homelink ${raw==='progress'?'act':''}" href="#progress">My progress and export</a><a class="homelink ${raw==='verify'?'act':''}" href="#verify">For instructors: check reports</a>`;
    main.innerHTML=SC[raw].r();return}
  if(!SESSION){side.innerHTML='';main.innerHTML=loginScreen();return}
  if(SESSION.kind==='emp'){
    const route=raw&&!['home','login'].includes(raw)?raw:'me';const mgr=isMgr(SESSION.id);
    side.innerHTML=`<p class="navh">My HR</p>`+['me','me-profile','me-leave','me-pay','me-goals'].map(k=>navLink(k,PS[k].t,PS[k].th,route)).join('')+
      `<p class="navh">Company</p>`+['me-cal','me-dir'].map(k=>navLink(k,PS[k].t,PS[k].th,route)).join('')+
      (mgr?`<p class="navh">My team</p>`+['team','team-leave'].map(k=>navLink(k,PS[k].t,PS[k].th,route)).join(''):'');
    let h;
    if(PS[route]&&(!PS[route].mgr||mgr)){ui.lastDeny='';const sc=PS[route];try{h=(route==='me'?'':`<h1>${sc.t}</h1><p class="sub">${sc.th}</p><div style="height:16px"></div>`)+sc.r()}catch(err){console.error(err);h='<p class="empty">This screen could not load.</p>'}}
    else if(PS[route])h=deniedPage(route,'Team pages are only for managers, and only cover their own direct reports. Your account has no direct reports.');
    else if(ITEM[route]||SY[route])h=deniedPage(route,`This page is part of the HR admin system. Your role is ${roleOf()}, which doesn't include HR admin permissions.`);
    else h=PS.me.r();
    main.innerHTML=h;return}
  /* HR admin */
  const route=raw&&raw!=='login'?raw:'home';
  const it=ITEM[route];if(it)ui.openMod=it.mod.n;
  side.innerHTML=`<a class="homelink ${route==='home'||(!it&&!SY[route])?'act':''}" href="#home">Home and exercises</a>`+modNav(route)+`<p class="navh">System administration</p>`+Object.keys(SY).map(k=>navLink(k,SY[k].t,SY[k].th,route)).join('')+`<a class="homelink" href="#progress" style="margin-top:12px;font-weight:400;font-size:13px;color:var(--muted)">Student tools: progress and export</a>`;
  if(PS[route]){main.innerHTML=deniedPage(route,"This page belongs to the employee portal. The HR administrator account isn't an employee, so it has no payslips, leave or goals of its own.");return}
  ui.lastDeny='';
  if(SY[route]){const sc=SY[route];main.innerHTML=`<p class="crumb">System administration</p><h1>${sc.t}</h1><p class="sub">${sc.th}</p><div class="hint">${sc.d}</div>${sc.r()}`;return}
  const ctx=route==='home'?`<div class="ctx warn"><span>Your work is saved only in this browser on this device. <a href="#progress">Download your progress report</a> regularly: it's your backup and what you submit to your instructor.</span></div>`:'';
  const sc=SC[route]||SC.home;let h;
  try{h=sc.r()}catch(err){console.error(err);h='<p class="empty">This screen could not load its data. Go back to Home and try again.</p>'}
  main.innerHTML=ctx+(route==='home'||!it?h:`<p class="crumb">Module ${it.mod.n}: ${it.mod.en}</p><h1>${it.en}</h1><p class="sub">${it.th}</p>${sc.d?`<div class="hint">${sc.d}</div>`:''}${h}`);
}
window.addEventListener('hashchange',()=>{document.body.classList.remove('nav');window.scrollTo(0,0);render()});

/* ---------- boot ---------- */
function boot(){MODE='solo';if(!S.student)S.student={name:'',sid:'',section:''};if(!S.started)S.started=Date.now();if(SESSION&&SESSION.kind==='emp'&&!ME())SESSION=null;render()}

render();
boot();

</script>
</body>
</html>
